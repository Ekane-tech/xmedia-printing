<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">TH Clothes and Xmedia T-shirt promotion</title>
  <desc id="desc">Quality cotton T-shirts in every colour and size from 1,500 FCFA at IPPB Street Bonamoussadi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051b4d"/>
      <stop offset="0.52" stop-color="#0b1660"/>
      <stop offset="1" stop-color="#ec0876"/>
    </linearGradient>
    <radialGradient id="price" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#20232e"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="7" stdDeviation="1" flood-color="#111" flood-opacity=".9"/>
    </filter>
    <symbol id="shirt" viewBox="0 0 120 110">
      <path d="M36 12 16 22 2 49l23 12 8-14v53h54V47l8 14 23-12-14-27-20-10c-5 12-12 17-24 17S41 24 36 12Z" fill="currentColor" stroke="#fff" stroke-opacity=".32" stroke-width="2"/>
      <path d="M45 13c3 7 8 10 15 10s12-3 15-10" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="3"/>
    </symbol>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#fff" opacity=".11"/>
    </pattern>
  </defs>

  <rect width="720" height="1080" fill="url(#bg)"/>
  <rect width="720" height="1080" fill="url(#dots)"/>
  <path d="M0 0 220 0 0 260Z" fill="#ffe600" opacity=".96"/>
  <path d="M720 0 520 0 720 250Z" fill="#087dc1" opacity=".9"/>
  <path d="M0 1060 280 760 0 770Z" fill="#ed0876" opacity=".65"/>
  <path d="M720 1040 520 760 720 790Z" fill="#ffe600" opacity=".55"/>

  <g transform="translate(48 32)">
    <circle cx="55" cy="55" r="50" fill="#bd0b19" stroke="#fff" stroke-width="5"/>
    <text x="55" y="55" fill="#fff" font-family="Arial Black,Arial" font-size="31" font-weight="900" text-anchor="middle">TH</text>
    <text x="55" y="77" fill="#fff" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">CLOTHES</text>
  </g>
  <g transform="translate(365 49)">
    <text x="0" y="35" fill="#fff" font-family="Arial Black,Arial" font-size="42" font-weight="900" letter-spacing="-3"><tspan fill="#087dc1">X</tspan><tspan fill="#ed0876">M</tspan>EDIA</text>
    <text x="6" y="57" fill="#ffe600" font-family="Arial" font-size="12" font-weight="700" letter-spacing="2">SUPPLY &amp; SERVICES</text>
  </g>

  <g filter="url(#textShadow)">
    <text x="360" y="220" fill="#ffe600" stroke="#bd0b19" stroke-width="12" paint-order="stroke" font-family="Arial Black,Impact,Arial" font-size="94" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="-4">PROMOTION!</text>
    <text x="360" y="310" fill="#fff" stroke="#080b17" stroke-width="10" paint-order="stroke" font-family="Arial Black,Impact,Arial" font-size="104" font-weight="900" text-anchor="middle" letter-spacing="-3">T-SHIRTS</text>
  </g>
  <rect x="126" y="330" width="468" height="45" rx="5" fill="#ffe600" transform="rotate(-1 360 352)"/>
  <text x="360" y="361" fill="#111" font-family="Arial Black,Arial" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="2">ALL COLOURS • ALL SIZES</text>

  <g opacity=".98">
    <use href="#shirt" x="-8" y="382" width="140" height="128" color="#f53147"/>
    <use href="#shirt" x="102" y="370" width="140" height="128" color="#ffd51f"/>
    <use href="#shirt" x="214" y="383" width="140" height="128" color="#12a3df"/>
    <use href="#shirt" x="366" y="383" width="140" height="128" color="#2eb45b"/>
    <use href="#shirt" x="478" y="370" width="140" height="128" color="#7e3ab8"/>
    <use href="#shirt" x="588" y="382" width="140" height="128" color="#ef7622"/>
  </g>

  <g transform="translate(360 628)" filter="url(#shadow)">
    <circle r="180" fill="#ffe600"/>
    <circle r="166" fill="url(#price)" stroke="#12151b" stroke-width="6"/>
    <text x="0" y="-92" fill="#fff" font-family="Arial Black,Arial" font-size="25" font-weight="900" text-anchor="middle" letter-spacing="2">AS FROM</text>
    <text x="0" y="22" fill="#ffe600" stroke="#bd0b19" stroke-width="7" paint-order="stroke" font-family="Arial Black,Impact,Arial" font-size="128" font-weight="900" text-anchor="middle" letter-spacing="-8">1,500</text>
    <text x="0" y="88" fill="#fff" font-family="Arial Black,Arial" font-size="56" font-weight="900" font-style="italic" text-anchor="middle">FCFA</text>
    <text x="0" y="126" fill="#ffe600" font-family="Arial" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="2">100% COTTON</text>
  </g>

  <g transform="translate(50 838)">
    <rect width="620" height="72" rx="10" fill="#fff" opacity=".97"/>
    <g transform="translate(22 13)">
      <circle cx="23" cy="23" r="23" fill="#17a960"/>
      <path d="M13 13c-7 8 2 23 11 29 5 3 12-3 12-7 0-3-8-7-10-6-2 1-3 4-5 3-3-2-8-8-7-11 0-2 4-3 4-6 0-2-3-5-5-2Z" fill="#fff"/>
    </g>
    <text x="82" y="29" fill="#0b1736" font-family="Arial Black,Arial" font-size="19" font-weight="900">WHATSAPP NOW</text>
    <text x="82" y="56" fill="#ed0876" font-family="Arial Black,Arial" font-size="25" font-weight="900">682 435 366  |  651 843 671</text>
  </g>

  <g transform="translate(40 936)">
    <circle cx="21" cy="23" r="21" fill="#ffe600"/>
    <path d="M21 10c-8 0-13 6-13 13 0 10 13 22 13 22s13-12 13-22c0-7-5-13-13-13Zm0 18a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z" fill="#0b1736"/>
    <text x="58" y="19" fill="#fff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">AVAILABLE AT</text>
    <text x="58" y="47" fill="#ffe600" font-family="Arial Black,Arial" font-size="26" font-weight="900">IPPB STREET BONAMOUSSADI</text>
  </g>

  <rect x="0" y="1037" width="720" height="43" fill="#ed0876"/>
  <text x="360" y="1065" fill="#fff" font-family="Arial Black,Arial" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">COMFORT • QUALITY • STYLE</text>
</svg>
